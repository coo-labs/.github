name: Registry drift-check

# Thin trigger: fires on PR/push/schedule events touching repos.yaml and
# delegates to the canonical reusable workflow at
# coo-labs/coo-harness/.github/workflows/registry-check-reusable.yml.
#
# Co-location: coo-memory#1018 (G5 substrate-self-describes — one
# canonical path per concern). Replaces the prior split where this
# workflow checked out coo-harness at runtime to invoke its script;
# the reusable now wraps the script alongside it. Source: coo-memory#999
# (F17b drift-check).

on:
  pull_request:
    paths:
      - 'repos.yaml'
      - '.github/workflows/registry-check.yml'
  push:
    branches: [main]
    paths:
      - 'repos.yaml'
  schedule:
    # Daily at 12:00 UTC.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    uses: coo-labs/coo-harness/.github/workflows/registry-check-reusable.yml@main
    secrets: inherit
